<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Overlay -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
  <rect width="400" height="400" fill="url(#grid)" opacity="0.6"/>

  <!-- Ambient Glow -->
  <circle cx="200" cy="180" r="140" fill="url(#glow)"/>

  <!-- Avatar Silhouette -->
  <g transform="translate(0, 10)">
    <!-- Head Circle -->
    <circle cx="200" cy="140" r="60" fill="#1e293b" stroke="url(#avatarGrad)" stroke-width="3"/>
    
    <!-- Face Silhouette / Glasses Accent -->
    <path d="M 170 135 Q 200 130 230 135" stroke="#0ea5e9" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="180" cy="135" r="10" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="220" cy="135" r="10" fill="none" stroke="#06b6d4" stroke-width="2"/>

    <!-- Shoulders / Torso -->
    <path d="M 100 320 C 100 230, 300 230, 300 320 Z" fill="#131d31" stroke="#334155" stroke-width="2"/>
    <path d="M 150 260 L 200 320 L 250 260" stroke="#0ea5e9" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- Placeholder Text Overlay -->
  <rect x="60" y="340" width="280" height="32" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" opacity="0.9"/>
  <text x="200" y="361" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">
    [ ADD YOUR PHOTO HERE ]
  </text>
</svg>
